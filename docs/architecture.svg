<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">Hardware verification loop</title>
<desc id="architecture-desc">Two one-bit inputs drive seven measured logic outputs.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { color: #2d3142; font-family: Geist,Arial,sans-serif; }
      #architecture-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#architecture-root .diagram-container { overflow-x:visible }
}</style><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="48" font-family="Instrument Serif, Georgia, serif" font-size="28" fill="#2d3142">Hardware verification loop</text>
<text x="40" y="76" font-family="Geist, Arial, sans-serif" font-size="11" fill="#5a6580">Two one-bit inputs drive seven measured logic outputs.</text>
<path d="M 264,220 H 352" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 352,260 H 264" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 576,220 H 688" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 688,260 H 576" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 152,288 V 408" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 464,408 V 344 Q 464,336 456,336 H 224 Q 216,336 216,328 V 288" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<g data-node="Python server"><rect x="40" y="192" width="224" height="96" rx="6" fill="#f2e7e2" stroke="#bf4520" stroke-width="1.8"/>
<text x="56" y="210" fill="#bf4520" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">CORE</text>
<text x="56" y="232" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Python server</text>
<text x="56" y="250" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">Sequence + scoreboard</text>
</g>
<g data-node="Arduino bridge"><rect x="352" y="192" width="224" height="96" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="368" y="210" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">DEVICE</text>
<text x="368" y="232" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Arduino bridge</text>
<text x="368" y="250" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">115200 baud / GPIO I/O</text>
</g>
<g data-node="Physical logic circuit"><rect x="688" y="192" width="224" height="96" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="704" y="210" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">DEVICE</text>
<text x="704" y="232" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Physical logic circuit</text>
<text x="704" y="250" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">5 logic outputs + SUM / CARRY</text>
</g>
<g data-node="Browser monitor"><rect x="40" y="408" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="56" y="426" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">OUTPUT</text>
<text x="56" y="448" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Browser monitor</text>
<text x="56" y="466" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">WebSocket :8765</text>
</g>
<g data-node="Golden truth table"><rect x="352" y="408" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="368" y="426" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">REFERENCE</text>
<text x="368" y="448" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Golden truth table</text>
<text x="368" y="466" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">4 input pairs / 7 outputs</text>
</g>
<line x1="40" y1="548" x2="920" y2="548" stroke="#4f5d75" stroke-width="0.7"/>
<text x="40" y="568" font-family="Geist, Arial, sans-serif" font-size="10" fill="#5a6580">The server ignores browser control messages. The current loop advances inputs automatically.</text>
<text x="40" y="588" font-family="Geist Mono, Consolas, monospace" font-size="8" fill="#5a6580">ARROWS: DATA OR DEPENDENCY DIRECTION   /   SOURCE: REPOSITORY FILES</text>
</svg>
